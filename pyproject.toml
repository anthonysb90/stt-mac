[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aloud"
version = "0.1.0"
description = "Push-to-talk dictation for macOS"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-AVFoundation>=10.3",
    "pyobjc-framework-ApplicationServices>=10.3",
    "sounddevice>=0.4.6",
    # Imported directly, to download model weights with the real error visible
    # rather than the one parakeet-mlx substitutes. Both local engines pull it
    # in anyway; naming it means we do not depend on that staying true.
    "huggingface-hub>=0.23",
    # Apple Silicon only: MLX has no x86_64 build.
    "parakeet-mlx>=0.5.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Intel default; also works on Apple Silicon if installed by hand.
    "faster-whisper>=1.1.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
parakeet = ["parakeet-mlx>=0.5.0"]
whisper = ["faster-whisper>=1.1.0"]

[project.scripts]
aloud = "aloud.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
